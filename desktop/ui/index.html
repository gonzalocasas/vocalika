<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vocalika</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; display: grid; place-items: center;
        background: #0e1011; color: #e8e6e3;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(460px, 86vw); }
      h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
      #step { color: #b9b6b1; margin: 0 0 18px; }
      .bar { height: 6px; border-radius: 3px; background: #24272a; overflow: hidden; }
      .bar > div { height: 100%; width: 0; background: #e2b45c; transition: width .4s ease; }
      #detail {
        margin-top: 10px; color: #7d7a76; font: 12px ui-monospace, Menlo, monospace;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #error { display: none; margin-top: 18px; }
      #error pre {
        max-height: 160px; overflow: auto; padding: 10px; border-radius: 6px;
        background: #1b1d1f; color: #e8a09a; font-size: 12px; white-space: pre-wrap;
      }
      button {
        font: inherit; padding: 6px 16px; border-radius: 6px; border: 0;
        background: #e2b45c; color: #111; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vocalika</h1>
      <p id="step">Starting…</p>
      <div class="bar"><div id="fill"></div></div>
      <div id="detail"></div>
      <div id="error">
        <pre id="message"></pre>
        <button id="retry">Repair and retry</button>
      </div>
    </main>
    <script>
      const { listen } = window.__TAURI__.event;
      const { invoke } = window.__TAURI__.core;
      const $ = (id) => document.getElementById(id);
      // Some steps print little (the model download) or nothing for a while,
      // so the step line carries a running clock to show it is not stuck.
      let stepText = "", stepStarted = 0, clock = 0;
      const tick = () => {
        const seconds = Math.floor((Date.now() - stepStarted) / 1000);
        $("step").textContent = seconds >= 3 ? `${stepText} ${seconds} s` : stepText;
      };
      listen("progress", ({ payload }) => {
        stepText = payload.step;
        stepStarted = Date.now();
        clearInterval(clock);
        clock = payload.fraction < 1 ? setInterval(tick, 1000) : 0;
        tick();
        $("fill").style.width = `${Math.round(payload.fraction * 100)}%`;
        $("detail").textContent = "";
      });
      listen("detail", ({ payload }) => { $("detail").textContent = payload; });
      listen("failed", ({ payload }) => {
        clearInterval(clock);
        $("step").textContent = "Vocalika could not start.";
        $("message").textContent = payload;
        $("error").style.display = "block";
      });
      $("retry").addEventListener("click", () => {
        $("error").style.display = "none";
        invoke("repair");
      });
      invoke("start");
    </script>
  </body>
</html>
