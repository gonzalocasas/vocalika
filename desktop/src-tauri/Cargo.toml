[package]
name = "vocalika-desktop"
version = "0.5.0"
description = "Desktop launcher: builds Vocalika's Python environment with uv, then shows the app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-updater = "2"
serde_json = "1"
