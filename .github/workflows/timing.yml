name: Audio timing guardrails
on: [push, pull_request]
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The locked versions, not whatever pip resolves today: `--locked`
      # also fails the run if uv.lock no longer matches pyproject.toml.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - run: uv sync --locked --extra dev --python 3.12
      - name: Physical timeline and audio rendering regressions
        run: uv run pytest -q tests/unit/test_playback_timing.py tests/unit/test_project_export.py tests/unit/test_reference_audio.py tests/unit/test_projects.py tests/synthetic/test_alignment_offsets.py
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
