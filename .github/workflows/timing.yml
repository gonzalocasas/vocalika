name: Audio timing guardrails
on: [push, pull_request]
jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: python -m pip install -e '.[dev]'
      - name: Physical timeline and audio rendering regressions
        run: python -m pytest -q tests/unit/test_playback_timing.py tests/unit/test_project_export.py tests/unit/test_reference_audio.py tests/unit/test_projects.py tests/synthetic/test_alignment_offsets.py
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
