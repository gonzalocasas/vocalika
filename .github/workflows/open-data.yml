name: Open datasets

# The tests against human-annotated singing (docs/OPEN_DATASETS.md). They
# take up to 45 minutes, so they run only when a change can move their
# numbers: the analysis and scoring code, the dependencies, or the tests
# themselves. Every release pull request bumps src/vocalika/__init__.py, so
# each release is checked before it is merged. A dataset that failed to
# install fails its tests rather than skipping them, so a green run always
# means every test ran.
#
# The weekly run keeps the dataset cache alive (GitHub drops caches unused
# for 7 days) and catches a dataset host or dependency going bad.

on:
  pull_request:
    # Kept identical to the push list below.
    paths:
      - src/vocalika/__init__.py
      - src/vocalika/analysis/**
      - src/vocalika/audio/**
      - src/vocalika/cache/**
      - src/vocalika/models/**
      - src/vocalika/practice/**
      - src/vocalika/config.py
      - src/vocalika/pipeline.py
      - pyproject.toml
      - uv.lock
      - scripts/fetch_open_datasets.py
      - tests/integration/**
      - .github/workflows/open-data.yml
  push:
    branches: [main]
    paths:
      - src/vocalika/__init__.py
      - src/vocalika/analysis/**
      - src/vocalika/audio/**
      - src/vocalika/cache/**
      - src/vocalika/models/**
      - src/vocalika/practice/**
      - src/vocalika/config.py
      - src/vocalika/pipeline.py
      - pyproject.toml
      - uv.lock
      - scripts/fetch_open_datasets.py
      - tests/integration/**
      - .github/workflows/open-data.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-data:
    name: Open datasets (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: tests-open-data-${{ matrix.datasets }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vocadito and MAST
            datasets: vocadito mast-melody
            tests: tests/integration/test_open_datasets.py
          - name: Choral Singing Dataset
            datasets: csd
            tests: tests/integration/test_choral_singing.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - run: uv sync --locked --extra dev --python 3.12
      - uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: torch-hub-${{ hashFiles('src/vocalika/analysis/rmvpe.py') }}
      # The fetcher pins each archive's size and checksum, so its own source
      # is the cache key: a changed pin fetches afresh.
      - uses: actions/cache@v4
        with:
          path: tests/external-data
          key: open-data-${{ matrix.datasets }}-${{ hashFiles('scripts/fetch_open_datasets.py') }}
      - name: Fetch the datasets (a no-op once cached)
        run: uv run python scripts/fetch_open_datasets.py ${{ matrix.datasets }}
      - run: uv run pytest -m open_data ${{ matrix.tests }}
