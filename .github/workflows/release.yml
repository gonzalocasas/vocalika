name: Release

# Release Please keeps a release pull request open on main, with the
# changelog and version bumps worked out from Conventional Commit messages.
# Merging it tags the release; the desktop apps are then built on each
# platform and attached to it.
#
# Run it by hand with a tag to rebuild the apps for an existing release, or
# without one to test-build the chosen branch: the installers are then kept
# as artifacts of the run instead of being attached to a release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the apps to (e.g. v0.2.0); empty test-builds the branch
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  desktop:
    needs: release-please
    # always(): on a manual run the release-please job is skipped.
    if: >-
      always() && (
        (github.event_name == 'push' && needs.release-please.outputs.created == 'true')
        || github.event_name == 'workflow_dispatch'
      )
    name: Desktop app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Macs are not a target: numba, llvmlite and sphn publish no
          # x86_64 macOS wheels at the locked versions.
          - name: macOS Apple Silicon
            runner: macos-15
            bundles: dmg
            assets: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows x64
            runner: windows-latest
            bundles: nsis
            assets: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      # This uv is also the one bundled into the app, which builds the user's
      # environment with it on first start.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: desktop
      - name: Gather uv, the locked requirements and the wheel
        run: npm run resources
        working-directory: desktop
      - name: Build the installer
        run: npx tauri build --bundles ${{ matrix.bundles }}
        working-directory: desktop
      - name: Attach it to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ${{ matrix.assets }} --clobber
      - name: Keep it with the run (test build)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: Vocalika ${{ matrix.name }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
