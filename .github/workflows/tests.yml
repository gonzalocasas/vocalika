name: Tests

# Lint, types, and every test that needs no open dataset, on every commit.
# The open-data tests run from open-data.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit, synthetic and golden tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer commit on the same branch makes this run moot.
    concurrency:
      group: tests-checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - run: uv sync --locked --extra dev --extra real-input --python 3.12
      # RMVPE's weights are downloaded on first use into torch's hub cache.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: torch-hub-${{ hashFiles('src/vocalika/analysis/rmvpe.py') }}
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy
      - run: uv run pytest -m "not open_data"
