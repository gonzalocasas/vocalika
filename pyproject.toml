[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vocalika"
# Read from src/vocalika/__init__.py, the one place Release Please bumps. A
# dynamic version also keeps it out of uv.lock, so a release never stales it.
dynamic = ["version"]
description = "Local-first vocal performance comparison"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Gonzalo Casas" }]
dependencies = [
  "av>=14,<17",
  "fastapi>=0.116,<1",
  "librosa>=0.11,<1",
  # torch 2.2 is built against numpy 1.
  "numpy>=1.26,<2",
  # Reads requirement markers for the About page's list of open source parts.
  "packaging>=24",
  "platformdirs>=4.4,<5",
  "plotly>=6.0,<7",
  "python-multipart>=0.0.20,<1",
  "scipy>=1.15,<2",
  "soundfile>=0.13,<1",
  # RMVPE, the pitch tracker. Pinned with torchaudio below (real-input).
  "torch==2.2.2",
  "typer>=0.16,<1",
  # Romanizes lyrics in other scripts for the aligner; MMS was trained on its
  # output. Its licence asks that publications acknowledge it (README).
  "uroman>=1.3.1,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]
real-input = [
  "demucs>=4.0.1,<5",
  # The MMS forced aligner that times lyrics. torchaudio is built against one
  # exact torch release, so this moves in lockstep with the torch in uv.lock;
  # releases from 2.9 on also drop forced_align.
  "torchaudio==2.2.2",
  # `deno` installs the JavaScript runtime YouTube's challenges need. The rest
  # is yt-dlp's `default` extra (the challenge solver scripts, networking,
  # decryption) without mutagen, which only tags and embeds thumbnails in
  # downloads: Vocalika does neither, and it is GPL.
  "yt-dlp[deno]>=2025.1.1",
  "yt-dlp-ejs",
  "brotli; implementation_name == 'cpython'",
  "certifi",
  "pycryptodomex",
  "requests>=2.32.2,<3",
  "urllib3>=2.0.2,<3",
  "websockets>=13.0",
]

[project.scripts]
vocalika = "vocalika.cli:app"

[tool.hatch.version]
path = "src/vocalika/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vocalika"]

# The built web UI travels inside the wheel so an installed copy (the desktop
# app's uv-managed environment) can serve it without a repository checkout.
# hatch_build.py adds it to wheels (not editable installs); run
# `npm run build` in frontend/ before `uv build`.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "open_data: tests backed by optional, locally fetched open datasets",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vocalika"]

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*", "scipy", "scipy.*", "soundfile", "torchaudio", "torchaudio.*", "uroman"]
ignore_missing_imports = true
