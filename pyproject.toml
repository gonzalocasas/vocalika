[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vocalika"
version = "0.1.0"
description = "Local-first vocal performance comparison"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Gonzalo Casas" }]
dependencies = [
  "fastapi>=0.116,<1",
  "librosa>=0.11,<1",
  "numpy>=1.26,<3",
  "platformdirs>=4.4,<5",
  "plotly>=6.0,<7",
  "python-multipart>=0.0.20,<1",
  "scipy>=1.15,<2",
  "soundfile>=0.13,<1",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]
real-input = [
  "demucs>=4.0.1,<5",
  "numpy>=1.26,<2",
  "yt-dlp>=2025.1.1",
]

[project.scripts]
vocalika = "vocalika.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vocalika"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "open_data: tests backed by optional, locally fetched open datasets",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vocalika"]

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*", "scipy", "scipy.*", "soundfile"]
ignore_missing_imports = true
